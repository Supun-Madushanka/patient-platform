server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Auth Service
        - id: auth-service
          uri: lb://auth-service        # lb = load balanced via Eureka
          predicates:
            - Path=/api/auth/**         # any request starting with /api/auth

        # Patient Service
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**

        # Doctor Service
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/doctors/**

        # Appointment Service
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**

        # Medical Records Service
        - id: medical-records-service
          uri: lb://medical-records-service
          predicates:
            - Path=/api/records/**

        # Billing Service
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/invoices/**

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

# Eureka — where to find service-registry
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true